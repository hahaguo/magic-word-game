<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>百词闯关 · 魔法王国</title>
<style>
/* ══ 基础 ══════════════════════════════════════════ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  min-height: 100vh; overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 20% 50%, rgba(255,255,255,.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(255,182,193,.15) 0%, transparent 50%),
    radial-gradient(circle at 40% 20%, rgba(173,216,230,.15) 0%, transparent 50%);
}

.screen { display: none; min-height: 100vh; padding: 20px 16px; flex-direction: column; align-items: center; }
.screen.active { display: flex; }

.panel {
  width: 100%; max-width: 860px; background: rgba(255,255,255,.95);
  border-radius: 24px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  backdrop-filter: blur(10px);
}

/* ══ 首页 ══════════════════════════════════════════ */
#home { padding-top: 24px; }
.back-link {
  align-self: flex-start; color: rgba(255,255,255,.85); text-decoration: none;
  font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
}
.back-link:hover { color: white; }
.brand { text-align: center; margin-bottom: 20px; }
.brand h1 { font-size: 28px; font-weight: 800; color: white;
  text-shadow: 0 2px 12px rgba(0,0,0,.3); }
.brand p { color: rgba(255,255,255,.85); font-size: 14px; margin-top: 6px; }

/* 套数选择 */
.set-label { font-size: 13px; font-weight: 700; color: #764ba2; margin-bottom: 10px; letter-spacing: .5px; }
.set-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; margin-bottom: 6px; }
.set-card {
  background: #f5f0ff; border-radius: 12px; padding: 12px 6px; text-align: center;
  cursor: pointer; border: 2px solid transparent; transition: all .15s;
}
.set-card:active { transform: scale(.95); }
.set-card.sel { border-color: #764ba2; background: #ede0ff; }
.set-card .sn { font-size: 13px; font-weight: 700; color: #764ba2; }
.set-card .st { font-size: 10px; color: #9b72cf; margin-top: 3px; line-height: 1.3; }
.set-all { grid-column: span 4; background: #f0f8ff; }
.set-all.sel { border-color: #667eea; background: #e0eaff; }
.set-all .sn { color: #667eea; }

/* 模式卡 */
.mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; margin-top: 16px; }
.mode-card {
  border-radius: 16px; padding: 20px 12px; text-align: center; cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,.12); transition: all .2s; border: none;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.mode-card:hover { transform: translateY(-4px); }
.mode-card:active { transform: scale(.96); }
.mode-card .mi { font-size: 2.2em; }
.mode-card .mn { font-size: 15px; font-weight: 700; }
.mode-card .md { font-size: 11px; line-height: 1.4; opacity: .8; }
.mc-match { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); }
.mc-quiz  { background: linear-gradient(135deg, #a8edea, #4db8a0); }
.mc-flash { background: linear-gradient(135deg, #fd79a8, #e84393); color: white; }
.mc-flash .md { opacity: .85; }

/* ══ 游戏通用头部 ══════════════════════════════════ */
.game-nav {
  display: flex; align-items: center; width: 100%; max-width: 860px;
  margin-bottom: 14px; gap: 10px;
}
.g-back { background: rgba(255,255,255,.25); border: none; color: white;
  font-size: 18px; border-radius: 10px; padding: 8px 14px; cursor: pointer; }
.g-back:active { transform: scale(.95); }
.g-title { flex: 1; color: white; font-size: 16px; font-weight: 700; text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.2); }
.g-info { color: white; font-size: 14px; font-weight: 700; min-width: 56px; text-align: right; }

.prog-bar { width: 100%; max-width: 860px; height: 8px; background: rgba(255,255,255,.3);
  border-radius: 4px; margin-bottom: 14px; overflow: hidden; }
.prog-fill { height: 100%; background: white; border-radius: 4px; transition: width .4s; }

/* ══ 配对翻牌 ══════════════════════════════════════ */
#match { padding-top: 20px; }
.match-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 10px; width: 100%; max-width: 860px;
}
.mc {
  aspect-ratio: 1/.75; border-radius: 12px; cursor: pointer;
  perspective: 600px; position: relative;
}
.mc-inner {
  width: 100%; height: 100%; transform-style: preserve-3d;
  transition: transform .4s; position: relative;
}
.mc.flipped .mc-inner { transform: rotateY(180deg); }
.mc.matched .mc-inner { transform: rotateY(180deg); }
.mc-face {
  position: absolute; inset: 0; border-radius: 12px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; align-items: center; justify-content: center;
  padding: 8px; text-align: center; font-weight: 700;
  box-shadow: 0 4px 14px rgba(0,0,0,.12);
}
.mc-back {
  background: linear-gradient(135deg, #667eea, #764ba2);
  font-size: 24px; color: rgba(255,255,255,.4);
}
.mc-front-en {
  background: white; font-size: 13px; color: #333; transform: rotateY(180deg);
  border: 2px solid #e0d0ff;
}
.mc-front-zh {
  background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
  font-size: 14px; color: #5d4e00; transform: rotateY(180deg);
}
.mc.matched .mc-face { border: 2.5px solid #00b894; }
.mc.matched .mc-front-en { background: #e8f8f5; }
.mc.matched .mc-front-zh { background: #e8f8f5; }
.mc.wrong-flash { animation: wrongFlash .4s; }
@keyframes wrongFlash { 0%,100%{} 40%{background: rgba(255,100,100,.3);} }
.match-stats {
  display: flex; gap: 16px; width: 100%; max-width: 860px;
  justify-content: center; margin-bottom: 10px;
}
.stat-chip {
  background: rgba(255,255,255,.25); color: white; border-radius: 20px;
  padding: 6px 16px; font-size: 14px; font-weight: 700;
}

/* ══ 快问快答 ══════════════════════════════════════ */
#quiz { padding-top: 20px; }
.timer-bar { width: 100%; max-width: 860px; height: 10px;
  background: rgba(255,255,255,.3); border-radius: 5px; margin-bottom: 14px; overflow: hidden; }
.timer-fill { height: 100%; border-radius: 5px; transition: width .1s linear; }
.timer-normal { background: #00b894; }
.timer-warn   { background: #fdcb6e; }
.timer-urgent { background: #e17055; }

.combo-badge {
  text-align: center; color: white; font-size: 13px; font-weight: 700;
  margin-bottom: 8px; min-height: 22px;
}
.combo-badge.active { color: #ffd93d; text-shadow: 0 0 8px rgba(255,200,0,.6); }

.q-card {
  width: 100%; max-width: 860px; background: rgba(255,255,255,.95);
  border-radius: 20px; padding: 30px 24px; text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,.15); margin-bottom: 16px;
}
.q-dir { font-size: 11px; color: #aaa; letter-spacing: 1px; margin-bottom: 8px; }
.q-word { font-size: 34px; font-weight: 800; color: #2d3436; line-height: 1.2; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 860px; }
.opt {
  background: rgba(255,255,255,.95); border: 2.5px solid transparent;
  border-radius: 14px; padding: 16px 12px; font-size: 16px; font-weight: 600;
  color: #333; cursor: pointer; line-height: 1.4; min-height: 64px;
  box-shadow: 0 4px 14px rgba(0,0,0,.08); transition: all .15s;
}
.opt:active { transform: scale(.97); }
.opt.correct { background: #e8f8f5; border-color: #00b894; color: #006150; }
.opt.wrong   { background: #fff0ee; border-color: #e17055; color: #8b2000; }
.opt:disabled { cursor: default; }

/* ══ 闪卡 ══════════════════════════════════════════ */
#flash { padding-top: 20px; }
.fc-counts {
  display: flex; gap: 16px; margin-bottom: 10px;
  justify-content: center; width: 100%; max-width: 500px;
}
.fc-count { font-size: 14px; font-weight: 700; padding: 5px 18px;
  border-radius: 20px; }
.fc-count.known   { background: rgba(0,184,148,.25); color: #00b894; }
.fc-count.unknown { background: rgba(225,112,85,.25); color: #e17055; }

.fc-wrap { perspective: 900px; width: 100%; max-width: 500px; margin: 12px 0 20px; }
.fc-card {
  width: 100%; height: 220px; border-radius: 22px;
  transform-style: preserve-3d; transition: transform .45s; cursor: pointer;
  position: relative;
}
.fc-card.flipped { transform: rotateY(180deg); }
.fc-face {
  position: absolute; inset: 0; border-radius: 22px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 24px;
  box-shadow: 0 8px 28px rgba(0,0,0,.12);
}
.fc-front {
  background: white; border: 2px solid #ede0ff;
}
.fc-back {
  background: linear-gradient(135deg, #667eea, #764ba2);
  transform: rotateY(180deg);
}
.fc-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; opacity: .5; margin-bottom: 10px; }
.fc-front .fc-label { color: #764ba2; }
.fc-back  .fc-label { color: rgba(255,255,255,.7); }
.fc-word { font-size: 30px; font-weight: 800; text-align: center; line-height: 1.2; }
.fc-front .fc-word { color: #2d3436; }
.fc-back  .fc-word { color: white; }
.fc-hint { font-size: 13px; margin-top: 8px; opacity: .5; }
.fc-front .fc-hint { color: #555; }
.fc-back  .fc-hint { color: white; }

.fc-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 500px; }
.fc-no  { background: linear-gradient(135deg, #ff6b6b, #e17055); color: white;
  padding: 18px 0; font-size: 17px; border-radius: 14px; border: none;
  cursor: pointer; font-weight: 700; box-shadow: 0 6px 18px rgba(225,112,85,.3); }
.fc-yes { background: linear-gradient(135deg, #00b894, #00cec9); color: white;
  padding: 18px 0; font-size: 17px; border-radius: 14px; border: none;
  cursor: pointer; font-weight: 700; box-shadow: 0 6px 18px rgba(0,184,148,.3); }
.fc-no:active, .fc-yes:active { transform: scale(.96); }
.fc-tap-hint { font-size: 13px; color: rgba(255,255,255,.7); margin-bottom: 6px; }

/* ══ 结果页 ══════════════════════════════════════== */
#result { padding-top: 30px; }
.res-panel { text-align: center; }
.res-stars { font-size: 44px; letter-spacing: 6px; margin-bottom: 10px; }
.res-score { font-size: 56px; font-weight: 800;
  background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text;
  -webkit-text-fill-color: transparent; background-clip: text; }
.res-sub { font-size: 16px; color: #636e72; margin-top: 6px; margin-bottom: 20px; }

.weak-box { text-align: left; border-top: 1px solid #f0e0ff; padding-top: 16px; margin-top: 4px; }
.weak-title { font-size: 14px; font-weight: 700; color: #e17055; margin-bottom: 10px; }
.weak-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.weak-chip { background: #fff0ee; border-radius: 20px; padding: 5px 14px;
  font-size: 13px; color: #c0392b; font-weight: 600; }
.weak-chip em { color: #999; font-style: normal; font-weight: 400; }

.res-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.r-retry { background: linear-gradient(135deg, #e17055, #d63031); color: white;
  padding: 15px; font-size: 16px; border-radius: 14px; border: none; cursor: pointer;
  font-weight: 700; box-shadow: 0 6px 18px rgba(214,48,49,.25); }
.r-again { background: linear-gradient(135deg, #667eea, #764ba2); color: white;
  padding: 15px; font-size: 16px; border-radius: 14px; border: none; cursor: pointer;
  font-weight: 700; box-shadow: 0 6px 18px rgba(102,126,234,.25); }
.r-home  { background: rgba(255,255,255,.9); color: #636e72;
  padding: 15px; font-size: 16px; border-radius: 14px; border: none; cursor: pointer;
  font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.08); }
.r-retry:active, .r-again:active, .r-home:active { transform: scale(.97); }

/* ══ 反馈动画 ══════════════════════════════════════ */
.feedback-overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 100;
}
.feedback-bubble {
  background: rgba(0,0,0,.75); color: white; border-radius: 20px;
  padding: 16px 32px; font-size: 22px; font-weight: 700;
  transform: scale(0); transition: transform .2s;
}
.feedback-bubble.show { transform: scale(1); }

@keyframes pop-in { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.pop { animation: pop-in .2s ease; }
@keyframes matched-pop { 0%{} 50%{transform: scale(1.12);} 100%{} }
.matched-anim { animation: matched-pop .35s ease; }

/* ══ iPad ══════════════════════════════════════════ */
@media only screen and (min-width: 768px) and (-webkit-min-device-pixel-ratio: 1.5) {
  .screen { padding: 28px 28px; }
  .panel { padding: 32px; }
  .brand h1 { font-size: 36px; }
  .set-grid { grid-template-columns: repeat(7, 1fr); }
  .set-all { grid-column: span 7; }
  .mode-grid { gap: 20px; }
  .mode-card { padding: 28px 16px; }
  .mode-card .mi { font-size: 2.8em; }
  .mode-card .mn { font-size: 17px; }
  .mode-card .md { font-size: 12px; }
  .match-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .mc-front-en { font-size: 15px; }
  .mc-front-zh { font-size: 16px; }
  .q-word { font-size: 42px; }
  .opts { gap: 14px; }
  .opt { font-size: 18px; padding: 20px 16px; min-height: 76px; }
  .fc-wrap { max-width: 620px; }
  .fc-card { height: 260px; }
  .fc-word { font-size: 38px; }
  .fc-btns { max-width: 620px; }
  .fc-counts { max-width: 620px; }
}
</style>
</head>
<body>

<!-- ══ 首页 ══════════════════════════════════════════ -->
<div id="home" class="screen active">
  <a class="back-link" href="../index.html">← 魔法王国</a>
  <div class="brand">
    <h1>✨ 百词闯关 ✨</h1>
    <p>选套数 · 选模式 · 开始挑战！</p>
  </div>

  <div class="panel">
    <div class="set-label">选择词汇套数</div>
    <div class="set-grid" id="setGrid">
      <div class="set-card sel" data-set="1"><div class="sn">第一套</div><div class="st">天气季节</div></div>
      <div class="set-card" data-set="2"><div class="sn">第二套</div><div class="st">情感动物</div></div>
      <div class="set-card" data-set="3"><div class="sn">第三套</div><div class="st">地点运动</div></div>
      <div class="set-card" data-set="4"><div class="sn">第四套</div><div class="st">水果短语</div></div>
      <div class="set-card" data-set="5"><div class="sn">第五套</div><div class="st">餐具职业</div></div>
      <div class="set-card" data-set="6"><div class="sn">第六套</div><div class="st">感官形容</div></div>
      <div class="set-card set-all" data-set="0"><div class="sn">🃏 全部混合</div></div>
    </div>

    <div class="mode-grid">
      <button class="mode-card mc-match" onclick="launch('match')">
        <span class="mi">🎴</span>
        <span class="mn">配对翻牌</span>
        <span class="md">翻开卡片，找到英中配对</span>
      </button>
      <button class="mode-card mc-quiz" onclick="launch('quiz')">
        <span class="mi">⚡</span>
        <span class="mn">限时问答</span>
        <span class="md">8秒内选出正确答案</span>
      </button>
      <button class="mode-card mc-flash" onclick="launch('flash')">
        <span class="mi">🃏</span>
        <span class="mn">闪卡记忆</span>
        <span class="md">翻牌认词，标记会与不会</span>
      </button>
    </div>
  </div>
</div>

<!-- ══ 配对翻牌 ══════════════════════════════════════ -->
<div id="match" class="screen">
  <div class="game-nav">
    <button class="g-back" onclick="goHome()">←</button>
    <div class="g-title">🎴 配对翻牌</div>
    <div class="g-info" id="matchInfo">0/8</div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="matchProg" style="width:0"></div></div>
  <div class="match-stats">
    <div class="stat-chip" id="matchMoves">翻牌：0</div>
    <div class="stat-chip" id="matchTime">⏱ 0s</div>
  </div>
  <div class="match-grid" id="matchGrid"></div>
</div>

<!-- ══ 限时问答 ══════════════════════════════════════ -->
<div id="quiz" class="screen">
  <div class="game-nav">
    <button class="g-back" onclick="goHome()">←</button>
    <div class="g-title">⚡ 限时问答</div>
    <div class="g-info" id="quizInfo">0/0</div>
  </div>
  <div class="timer-bar"><div class="timer-fill timer-normal" id="timerFill" style="width:100%"></div></div>
  <div class="combo-badge" id="comboBadge"></div>
  <div class="q-card">
    <div class="q-dir" id="qDir">英文 → 中文</div>
    <div class="q-word" id="qWord"></div>
  </div>
  <div class="opts" id="optsGrid"></div>
</div>

<!-- ══ 闪卡记忆 ══════════════════════════════════════ -->
<div id="flash" class="screen">
  <div class="game-nav">
    <button class="g-back" onclick="goHome()">←</button>
    <div class="g-title">🃏 闪卡记忆</div>
    <div class="g-info" id="flashInfo">0/0</div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="flashProg" style="width:0"></div></div>
  <div class="fc-counts">
    <div class="fc-count known"  id="fcKnown">✓ 会了 0</div>
    <div class="fc-count unknown" id="fcUnknown">✗ 不会 0</div>
  </div>
  <div class="fc-tap-hint">点击卡片翻面查看答案</div>
  <div class="fc-wrap">
    <div class="fc-card" id="fcCard" onclick="flipFc()">
      <div class="fc-face fc-front">
        <div class="fc-label" id="fcFrontLab">ENGLISH</div>
        <div class="fc-word" id="fcFrontWord"></div>
        <div class="fc-hint">点击翻面 →</div>
      </div>
      <div class="fc-face fc-back">
        <div class="fc-label" id="fcBackLab">中文</div>
        <div class="fc-word" id="fcBackWord"></div>
      </div>
    </div>
  </div>
  <div class="fc-btns">
    <button class="fc-no"  onclick="fcAns(false)">✗ 不会</button>
    <button class="fc-yes" onclick="fcAns(true)">✓ 会了</button>
  </div>
</div>

<!-- ══ 结果页 ══════════════════════════════════════ -->
<div id="result" class="screen">
  <div class="panel res-panel">
    <div class="res-stars" id="resStars"></div>
    <div class="res-score" id="resScore"></div>
    <div class="res-sub"   id="resSub"></div>
    <div class="weak-box" id="weakBox" style="display:none">
      <div class="weak-title">📌 需要加强的词</div>
      <div class="weak-chips" id="weakChips"></div>
    </div>
    <div class="res-btns">
      <button class="r-retry" id="rRetry" style="display:none" onclick="retryWeak()">🔁 重练错词</button>
      <button class="r-again" onclick="retryAll()">再来一次</button>
      <button class="r-home"  onclick="goHome()">返回首页</button>
    </div>
  </div>
</div>

<!-- 反馈浮层 -->
<div class="feedback-overlay" id="fbOverlay">
  <div class="feedback-bubble" id="fbBubble"></div>
</div>

<script>
/* ══════════════════════════════════════════════════
   词汇数据
══════════════════════════════════════════════════ */
const SETS = [
  { id:1, title:"第一套", words:[
    {en:"rainy",zh:"下雨的"},{en:"snowy",zh:"下雪的"},{en:"windy",zh:"有风的"},
    {en:"sunny",zh:"晴朗的"},{en:"cloudy",zh:"多云的"},{en:"cold",zh:"冷的"},
    {en:"hot",zh:"热的"},{en:"warm",zh:"温暖的"},{en:"cool",zh:"凉爽的"},
    {en:"spring",zh:"春天"},{en:"summer",zh:"夏天"},{en:"autumn",zh:"秋天"},
    {en:"winter",zh:"冬天"},{en:"season",zh:"季节"},
    {en:"clothes",zh:"衣服"},{en:"coat",zh:"外套"},{en:"trousers",zh:"裤子"},
    {en:"sock",zh:"短袜"},{en:"sweater",zh:"毛衣"},{en:"skirt",zh:"裙子"},

const ALL_WORDS = (() => {
  const seen = new Set();
  return SETS.flatMap(s => s.words).filter(w => {
    if (seen.has(w.en)) return false; seen.add(w.en); return true;
  });
})();

/* ══════════════════════════════════════════════════
   状态
══════════════════════════════════════════════════ */
const S = {
  setId: 1, mode: null,
  deck: [], idx: 0, correct: 0, wrong: [],
  isWeak: false,
  // quiz
  combo: 0, timerInterval: null, timeLeft: 0, answered: false,
  // match
  matchPairs: 8, matchFound: 0, matchMoves: 0, matchStart: 0, matchTimer: null,
  matchFirst: null, matchLocked: false,
  // flash
  fcFlipped: false, fcKnown: 0, fcUnknown: 0
};

/* ══ 工具 ══ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.random() * (i+1) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(arr, n) { return shuffle(arr).slice(0, n); }
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() {
  clearInterval(S.timerInterval); clearInterval(S.matchTimer);
  showScreen('home');
}

/* 音效 */
function beep(freq, dur, vol = .25) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + dur);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function playCorrect() { beep(880, .15); setTimeout(() => beep(1100, .15), 120); }
function playWrong()   { beep(220, .3); }
function playComplete(){ beep(660,.12); setTimeout(()=>beep(880,.12),130); setTimeout(()=>beep(1100,.25),260); }

/* 浮层反馈 */
let fbTimer;
function showFb(text) {
  const b = document.getElementById('fbBubble');
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(fbTimer);
  fbTimer = setTimeout(() => b.classList.remove('show'), 900);
}

/* ══ 首页 ══ */
document.querySelectorAll('.set-card').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.set-card').forEach(x => x.classList.remove('sel'));
    c.classList.add('sel');
    S.setId = +c.dataset.set;
  });
});

function getWords() {
  const src = S.setId === 0 ? ALL_WORDS : (SETS.find(s => s.id === S.setId)?.words ?? ALL_WORDS);
  return S.isWeak ? S.wrong : src;
}

function launch(mode) {
  S.mode = mode; S.isWeak = false;
  startMode();
}
function retryAll() { S.isWeak = false; startMode(); }
function retryWeak() { S.isWeak = true; startMode(); }

function startMode() {
  const words = getWords();
  S.wrong = S.isWeak ? [...S.wrong] : [];
  S.correct = 0; S.idx = 0; S.combo = 0;
  clearInterval(S.timerInterval); clearInterval(S.matchTimer);

  if (S.mode === 'match') startMatch(words);
  else if (S.mode === 'quiz') startQuiz(words);
  else startFlash(words);
}

/* ══════════════════════════════════════════════════
   配对翻牌
══════════════════════════════════════════════════ */
function startMatch(words) {
  const n = Math.min(8, words.length);
  const pairs = pick(words, n);
  S.deck = pairs;
  S.matchPairs = n; S.matchFound = 0; S.matchMoves = 0;
  S.matchFirst = null; S.matchLocked = false;
  S.matchStart = Date.now();
  S.wrong = [];

  // Build card data: [{ id, word, side:'en'|'zh' }]
  const cards = shuffle([
    ...pairs.map((w,i) => ({ id:i, word:w, side:'en' })),
    ...pairs.map((w,i) => ({ id:i, word:w, side:'zh' }))
  ]);

  const grid = document.getElementById('matchGrid');
  grid.innerHTML = '';
  cards.forEach((c, ci) => {
    const el = document.createElement('div');
    el.className = 'mc';
    el.dataset.cid = ci;
    el.dataset.pid = c.id;
    el.dataset.side = c.side;
    el.innerHTML = `
      <div class="mc-inner">
        <div class="mc-face mc-back">✦</div>
        <div class="mc-face mc-front-${c.side}">${c.side === 'en' ? c.word.en : c.word.zh}</div>
      </div>`;
    el.addEventListener('click', () => onMatchClick(el));
    grid.appendChild(el);
  });

  updateMatchHeader();
  // timer
  S.matchTimer = setInterval(() => {
    const sec = Math.floor((Date.now() - S.matchStart) / 1000);
    document.getElementById('matchTime').textContent = `⏱ ${sec}s`;
  }, 500);

  showScreen('match');
}

function onMatchClick(el) {
  if (S.matchLocked) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;

  el.classList.add('flipped');
  beep(660, .08, .15);

  if (!S.matchFirst) {
    S.matchFirst = el; return;
  }

  S.matchMoves++;
  document.getElementById('matchMoves').textContent = `翻牌：${S.matchMoves}`;

  const first = S.matchFirst;
  S.matchFirst = null;
  S.matchLocked = true;

  if (first.dataset.pid === el.dataset.pid && first.dataset.side !== el.dataset.side) {
    // 匹配！
    setTimeout(() => {
      first.classList.add('matched');
      el.classList.add('matched');
      first.classList.add('matched-anim');
      el.classList.add('matched-anim');
      S.matchLocked = false;
      S.matchFound++;
      playCorrect();
      showFb(['✨ 配对成功！', '👏 太棒了！', '🌟 完美！'][Math.random()*3|0]);
      updateMatchHeader();
      if (S.matchFound >= S.matchPairs) finishMatch();
    }, 300);
  } else {
    // 不匹配
    setTimeout(() => {
      first.classList.remove('flipped');
      el.classList.remove('flipped');
      first.querySelector('.mc-inner').style.transform = '';
      el.querySelector('.mc-inner').style.transform = '';
      S.matchLocked = false;
      playWrong();
      // 记录错词
      const wid = +el.dataset.pid;
      const word = S.deck[wid];
      if (!S.wrong.find(w => w.en === word.en)) S.wrong.push(word);
    }, 800);
  }
}

function updateMatchHeader() {
  document.getElementById('matchInfo').textContent = `${S.matchFound}/${S.matchPairs}`;
  document.getElementById('matchProg').style.width = (S.matchFound / S.matchPairs * 100) + '%';
}

function finishMatch() {
  clearInterval(S.matchTimer);
  const sec = Math.floor((Date.now() - S.matchStart) / 1000);
  playComplete();
  const stars = S.matchMoves <= S.matchPairs ? '⭐⭐⭐' : S.matchMoves <= S.matchPairs * 1.8 ? '⭐⭐' : '⭐';
  showResult(stars, `${S.matchMoves} 次翻牌`, `用时 ${sec} 秒，共 ${S.matchPairs} 对`);
}

/* ══════════════════════════════════════════════════
   限时问答
══════════════════════════════════════════════════ */
const QUIZ_TIME = 8000;
const QUIZ_TOTAL = 15;

function startQuiz(words) {
  S.deck = shuffle(words);
  // extend deck if fewer than QUIZ_TOTAL
  while (S.deck.length < QUIZ_TOTAL) S.deck = [...S.deck, ...shuffle(words)];
  S.deck = S.deck.slice(0, QUIZ_TOTAL);
  S.idx = 0; S.correct = 0; S.combo = 0;
  S.wrong = [];
  showScreen('quiz');
  renderQuiz();
}

function renderQuiz() {
  clearInterval(S.timerInterval);
  const w = S.deck[S.idx];
  const total = S.deck.length;
  document.getElementById('quizInfo').textContent = `${S.idx}/${total}`;

  // direction: alternate en→zh / zh→en every 5 questions
  const en2zh = (S.idx % 10) < 5;
  document.getElementById('qDir').textContent = en2zh ? '英文 → 中文' : '中文 → 英文';
  document.getElementById('qWord').textContent = en2zh ? w.en : w.zh;
  document.getElementById('qWord').classList.add('pop');
  setTimeout(() => document.getElementById('qWord').classList.remove('pop'), 200);

  // combo display
  const cb = document.getElementById('comboBadge');
  if (S.combo >= 3) {
    cb.textContent = `🔥 连击 ×${S.combo}！+双倍积分`;
    cb.className = 'combo-badge active';
  } else { cb.textContent = ''; cb.className = 'combo-badge'; }

  // options
  const pool = ALL_WORDS.filter(x => x.en !== w.en);
  const wrong3 = pick(pool, 3);
  const choices = shuffle([w, ...wrong3]);

  const grid = document.getElementById('optsGrid');
  grid.innerHTML = '';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = en2zh ? c.zh : c.en;
    btn.addEventListener('click', () => answerQuiz(btn, c, w, en2zh));
    grid.appendChild(btn);
  });

  S.answered = false;
  startTimer();
}

function startTimer() {
  const fill = document.getElementById('timerFill');
  S.timeLeft = QUIZ_TIME;
  const step = 100;

  S.timerInterval = setInterval(() => {
    S.timeLeft -= step;
    const pct = Math.max(0, S.timeLeft / QUIZ_TIME * 100);
    fill.style.width = pct + '%';

    if (pct > 40)      { fill.className = 'timer-fill timer-normal'; }
    else if (pct > 20) { fill.className = 'timer-fill timer-warn'; }
    else               { fill.className = 'timer-fill timer-urgent'; }

    if (S.timeLeft <= 0) {
      clearInterval(S.timerInterval);
      if (!S.answered) timeOut();
    }
  }, step);
}

function timeOut() {
  S.answered = true;
  const w = S.deck[S.idx];
  // highlight correct
  document.querySelectorAll('.opt').forEach(b => {
    if (b.textContent === w.en || b.textContent === w.zh) b.classList.add('correct');
    b.disabled = true;
  });
  S.combo = 0;
  if (!S.wrong.find(x => x.en === w.en)) S.wrong.push(w);
  playWrong(); showFb('⏰ 时间到！');
  setTimeout(nextQuiz, 1200);
}

function answerQuiz(btn, chosen, correct, en2zh) {
  if (S.answered) return;
  S.answered = true;
  clearInterval(S.timerInterval);
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);

  const ok = chosen.en === correct.en;
  btn.classList.add(ok ? 'correct' : 'wrong');

  if (ok) {
    S.correct++;
    S.combo++;
    const pts = S.combo >= 3 ? 20 : 10;
    playCorrect();
    const msgs = ['✨ 正确！', '🌟 棒极了！', '👏 太厉害！', '🎯 完美！'];
    showFb((S.combo >= 3 ? `🔥 连击！+${pts}` : msgs[Math.random()*msgs.length|0]));
  } else {
    S.combo = 0;
    document.querySelectorAll('.opt').forEach(b => {
      if (b.textContent === (en2zh ? correct.zh : correct.en)) b.classList.add('correct');
    });
    if (!S.wrong.find(x => x.en === correct.en)) S.wrong.push(correct);
    playWrong(); showFb('❌ 加油！');
  }

  setTimeout(nextQuiz, 1000);
}

function nextQuiz() {
  S.idx++;
  if (S.idx >= S.deck.length) finishQuiz();
  else renderQuiz();
}

function finishQuiz() {
  const total = S.deck.length;
  const pct = S.correct / total;
  const stars = pct >= .9 ? '⭐⭐⭐' : pct >= .7 ? '⭐⭐' : '⭐';
  playComplete();
  showResult(stars, `${S.correct} / ${total}`, `正确率 ${Math.round(pct*100)}%`);
}

/* ══════════════════════════════════════════════════
   闪卡记忆
══════════════════════════════════════════════════ */
function startFlash(words) {
  S.deck = shuffle(words);
  S.idx = 0; S.fcFlipped = false; S.fcKnown = 0; S.fcUnknown = 0;
  S.wrong = [];
  showScreen('flash');
  renderFlash();
}

function renderFlash() {
  const w = S.deck[S.idx];
  S.fcFlipped = false;
  document.getElementById('fcCard').classList.remove('flipped');
  const en2zh = true; // always show EN first
  document.getElementById('fcFrontLab').textContent  = 'ENGLISH';
  document.getElementById('fcFrontWord').textContent = w.en;
  document.getElementById('fcBackLab').textContent   = '中文';
  document.getElementById('fcBackWord').textContent  = w.zh;
  updateFlashHeader();
}

function flipFc() {
  S.fcFlipped = !S.fcFlipped;
  document.getElementById('fcCard').classList.toggle('flipped', S.fcFlipped);
  if (S.fcFlipped) beep(660, .08, .15);
}

function fcAns(known) {
  if (!S.fcFlipped) { flipFc(); return; }
  const w = S.deck[S.idx];
  if (known) {
    S.fcKnown++; S.correct++;
    playCorrect(); showFb('✓ 会了！');
  } else {
    S.fcUnknown++;
    if (!S.wrong.find(x => x.en === w.en)) S.wrong.push(w);
    playWrong(); showFb('📌 已记录');
  }
  S.idx++;
  if (S.idx >= S.deck.length) finishFlash();
  else renderFlash();
}

function updateFlashHeader() {
  const total = S.deck.length;
  document.getElementById('flashInfo').textContent = `${S.idx+1}/${total}`;
  document.getElementById('flashProg').style.width = ((S.idx)/total*100) + '%';
  document.getElementById('fcKnown').textContent   = `✓ 会了 ${S.fcKnown}`;
  document.getElementById('fcUnknown').textContent = `✗ 不会 ${S.fcUnknown}`;
}

function finishFlash() {
  const total = S.deck.length;
  const pct = S.fcKnown / total;
  const stars = pct >= .9 ? '⭐⭐⭐' : pct >= .7 ? '⭐⭐' : '⭐';
  playComplete();
  showResult(stars, `${S.fcKnown} / ${total}`, `认识 ${Math.round(pct*100)}%`);
}

/* ══════════════════════════════════════════════════
   结果页
══════════════════════════════════════════════════ */
function showResult(stars, score, sub) {
  document.getElementById('resStars').textContent = stars;
  document.getElementById('resScore').textContent = score;
  document.getElementById('resSub').textContent   = sub;

  const wb = document.getElementById('weakBox');
  const rr = document.getElementById('rRetry');
  if (S.wrong.length > 0) {
    wb.style.display = 'block';
    rr.style.display = 'block';
    document.getElementById('weakChips').innerHTML =
      S.wrong.map(w => `<div class="weak-chip">${w.en} <em>${w.zh}</em></div>`).join('');
  } else {
    wb.style.display = 'none';
    rr.style.display = 'none';
  }
  showScreen('result');
}
